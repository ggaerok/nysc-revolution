<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>회전하는 물체 그리고 공전 - 점수판</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#e9eff5;font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:#fff;user-select:none}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#e9eff5;overflow:hidden}
  .screen{position:absolute;inset:0;display:none}
  .screen.on{display:block}

  /* ---------- 설정 화면 ---------- */
  #setup .card{position:absolute;left:310px;top:70px;width:1300px;height:940px;background:#343850;border-radius:28px;padding:44px 70px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
  #setup h1{font-size:62px;text-align:center;letter-spacing:2px}
  #setup h2{font-size:26px;text-align:center;color:#9fb4d6;margin-top:6px;font-weight:400}
  .sec-title{font-size:32px;font-weight:700;margin:34px 0 14px;color:#ffd84d}
  .team-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 22px}
  .team-in{min-width:0;overflow:hidden;display:flex;align-items:center;gap:12px;background:#222537;border-radius:14px;padding:6px 14px 6px 8px}
  .team-in .dot{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#000;flex:none}
  .team-in input{flex:1 1 0;width:0;min-width:0;background:transparent;border:0;outline:0;color:#fff;font-size:34px;font-family:inherit;padding:10px 4px;user-select:text}
  .team-in input::placeholder{color:#5b6285}
  .team-in:focus-within{outline:3px solid #ffd84d}
  .modes{display:flex;gap:26px}
  .mode{flex:1;display:block;cursor:pointer}
  .mode input{display:none}
  .mode .box{border:4px solid #4b5174;border-radius:18px;padding:22px 26px;background:#222537;height:170px}
  .mode .box b{display:block;font-size:36px;margin-bottom:8px}
  .mode .box span{font-size:22px;color:#9fb4d6;line-height:1.4}
  .mode input:checked + .box{border-color:#ffd84d;background:#3b3f26}
  #msg{height:36px;margin-top:20px;text-align:center;font-size:26px;color:#ff8b8b}
  #goBtn{display:block;margin:6px auto 0;width:520px;height:100px;border:0;border-radius:20px;background:#3593b8;color:#fff;font-size:46px;font-weight:800;cursor:pointer;font-family:inherit}
  #goBtn:hover{background:#44a8cf}

  /* ---------- 점수판 화면 ---------- */
  #topbar{position:absolute;left:20px;top:10px;width:1880px;height:165px}
  #ttl{position:absolute;left:6px;top:14px}
  #ttl h1{font-size:52px;letter-spacing:1px;color:#1d2a3c}
  #ttl{width:720px}
  #ttl p{font-size:26px;color:#4a5d78;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #sel{color:#d12b1f;font-weight:800}
  #sw{position:absolute;right:0;top:0;width:1120px;height:165px;background:#c9d8e6;border-radius:20px;padding:16px 20px;display:flex;align-items:stretch;gap:16px}
  #swTime{width:360px;background:#0f111b;border-radius:16px;font-size:88px;font-weight:800;text-align:center;line-height:133px;font-variant-numeric:tabular-nums;letter-spacing:1px;color:#7dffb0;flex:none}
  #swTime.run{color:#ffe95a}
  #bigBtns{display:flex;gap:10px;flex:none}
  .btn{border:0;border-radius:14px;font-weight:800;cursor:pointer;font-family:inherit;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.25);transition:filter .15s}
  .btn:hover:not(:disabled){filter:brightness(1.1)}
  .btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
  .btn.big{width:185px;font-size:44px}
  #smallBtns{display:flex;flex-direction:column;gap:7px;width:128px;flex:none}
  .btn.sm{flex:1;font-size:21px;border-radius:10px}
  #rightBtns{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
  #rightBtns .btn{flex:1;font-size:24px}
  #bUndo{background:#2f6fb8}
  #bManual{background:#b8651b}
  #bManual.on{background:#ff9d00;color:#000;outline:4px solid #7a3e00;outline-offset:-4px}
  .manual .unit .rec{cursor:text}
  #bUndo:disabled{background:#9db0c6;cursor:not-allowed;box-shadow:none}
  #bToggle{background:#2e9e5b}#bToggle.run{background:#e0a812;color:#000}
  #bFail{background:#d94242}
  #bReset{background:#5b6285}#bClear{background:#7a4fa8}#bHome{background:#3a4366}
  #ttl #swHint{font-size:22px;color:#c4600a;height:28px;margin-top:4px;font-weight:700}

  #board{position:absolute;left:20px;top:190px;width:1880px;height:876px;background:#000;padding:6px;display:grid;gap:6px;border-radius:4px}
  .c{display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;color:#000;overflow:hidden}
  .corner{background:#3593b8;position:relative;color:#fff;
    background-image:linear-gradient(to top right,transparent calc(50% - 2px),#fff calc(50% - 2px),#fff calc(50% + 2px),transparent calc(50% + 2px))}
  .corner .t{position:absolute;right:14px;top:10px;font-size:34px}
  .corner .j{position:absolute;left:14px;bottom:10px;font-size:34px}
  .th{font-size:44px}
  .ev{flex-direction:column;font-size:38px;line-height:1.18;background:#d6e4f0}
  .ev small{font-size:24px;font-weight:700;margin-top:4px}
  .r0{background:#d6e4f0}.r1{background:#f0f6fa}
  .pair{display:grid;grid-template-columns:minmax(0,1fr) var(--ptw,92px);grid-template-rows:minmax(0,1fr);gap:6px;min-width:0;min-height:0;background:#000;align-items:stretch;justify-content:stretch}
  .rec,.pt{display:flex;align-items:center;justify-content:center;font-weight:800;color:#111}
  .rec{font-size:var(--recfs,70px);font-variant-numeric:tabular-nums;cursor:pointer;position:relative;white-space:nowrap;overflow:hidden;min-width:0}
  .pt{font-size:56px;color:#c0392b}
  .r0 .rec,.r0 .pt{background:#d6e4f0}.r1 .rec,.r1 .pt{background:#f0f6fa}
  .unit{cursor:pointer}
  .unit.sel .rec,.unit.sel .pt,.unit.sel .pname{background:#fff3a8}
  .unit.sel .rec{box-shadow:inset 0 0 0 var(--selw,8px) #ff3b30}
  .rec.best{color:#0b5fb0}
  .rec input{width:100%;height:100%;border:0;background:transparent;text-align:center;font-size:var(--recfs,70px);font-weight:800;font-family:inherit;color:#111;outline:0;user-select:text}
  /* 전체기록 방식: 팀×종목 칸을 참가자 수만큼 나눔 */
  .pcell{display:grid;gap:3px;background:#000;min-height:0;min-width:0;align-items:stretch;justify-content:stretch;--selw:4px}
  .pcell.empty{display:flex;align-items:center;justify-content:center;color:#7a8aa0;font-size:22px;font-weight:700;background:#d6e4f0}
  .pcell.r1.empty{background:#f0f6fa}
  .prow{display:grid;grid-template-columns:42% minmax(0,1fr);gap:3px;min-height:0;min-width:0;background:#000}
  .pname{display:flex;align-items:center;justify-content:center;font-weight:800;color:#111;font-size:var(--nfs,20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;min-width:0}
  .r0 .pname{background:#d6e4f0}.r1 .pname{background:#f0f6fa}
  .pcell .rec{font-size:var(--rfs,24px)}
  .pcell .rec input{font-size:var(--rfs,24px)}
  .tot{font-size:40px}
  .totv{font-size:64px;color:#c0392b}

  /* ---------- 참가자 이름 입력 화면 ---------- */
  #ntop{position:absolute;left:26px;top:10px;width:1868px;height:140px}
  #ntitle h1{font-size:46px;color:#1d2a3c;letter-spacing:1px}
  #ntitle p{font-size:22px;color:#4a5d78;margin-top:4px}
  #ntitle #nmsg{color:#c4600a;font-weight:700;height:28px}
  #nbtns{position:absolute;right:0;top:10px;display:flex;gap:14px}
  #nbtns .btn{height:90px;font-size:38px}
  #nBack{width:160px;background:#5b6285}
  #nGo{width:320px;background:#3593b8}
  #nameGrid{position:absolute;left:20px;top:162px;width:1880px;height:900px;background:#000;padding:6px;display:grid;gap:6px;grid-template-rows:90px repeat(4,minmax(0,1fr));border-radius:4px}
  #nameGrid .th{font-size:36px}
  #nameGrid .ev{font-size:34px}
  .ncell{display:flex;flex-direction:column;gap:4px;padding:5px;min-height:0;min-width:0}
  .ncell.r0{background:#d6e4f0}.ncell.r1{background:#f0f6fa}
  .ncell input{flex:1;min-height:0;min-width:0;width:100%;border:2px solid #8ea4bd;border-radius:6px;background:#fff;color:#111;font-size:21px;font-weight:700;font-family:inherit;padding:0 10px;outline:0;user-select:text}
  .ncell input:focus{border-color:#ff9d00;background:#fffbe6}
  .ncell input::placeholder{color:#a7b4c4;font-weight:400}
</style>
</head>
<body>
<div id="stage">

  <!-- ===== 첫 화면 ===== -->
  <div id="setup" class="screen on">
    <div class="card">
      <h1>회전하는 물체 그리고 공전</h1>
      <h2>점수판 설정</h2>

      <div class="sec-title">① 팀 이름 입력 <span style="font-size:22px;color:#9fb4d6;font-weight:400">(한글·영문, 최소 2팀 / 빈칸은 제외됩니다)</span></div>
      <div class="team-grid" id="teamGrid"></div>

      <div class="sec-title">② 진행방법 선택</div>
      <div class="modes">
        <label class="mode"><input type="radio" name="mode" value="best" checked>
          <div class="box"><b>최고점 선택방식</b><span>시도할 때마다 기록을 비교해<br>가장 좋은 기록만 남깁니다.</span></div></label>
        <label class="mode"><input type="radio" name="mode" value="all">
          <div class="box"><b>전체기록 표시 방식</b><span>참가자별 이름과 기록을 모두<br>표에 표시합니다. (점수 계산 없음)</span></div></label>
      </div>
      <div id="msg"></div>
      <button id="goBtn">기록하기</button>
    </div>
  </div>

  <!-- ===== 참가자 이름 입력 화면 (전체기록 방식) ===== -->
  <div id="namesScreen" class="screen">
    <div id="ntop">
      <div id="ntitle">
        <h1>참가자 이름 입력</h1>
        <p>종목별로 팀마다 최대 5명까지 입력합니다. 입력한 순서대로 기록판에 표시되며 빈칸은 제외됩니다. (Enter = 다음 칸)</p>
        <p id="nmsg"></p>
      </div>
      <div id="nbtns">
        <button class="btn" id="nBack">뒤로</button>
        <button class="btn" id="nGo">기록하기</button>
      </div>
    </div>
    <div id="nameGrid"></div>
  </div>

  <!-- ===== 점수판 화면 ===== -->
  <div id="boardScreen" class="screen">
    <div id="topbar">
      <div id="ttl">
        <h1>회전하는 물체 그리고 공전</h1>
        <p><span id="modeTxt">최고점 방식</span> · 선택된 칸: <span id="sel">없음</span></p>
        <p id="swHint"></p>
      </div>
      <div id="sw">
        <div id="swTime">0:00.00</div>
        <div id="bigBtns">
          <button class="btn big" id="bToggle">시작</button>
          <button class="btn big" id="bFail">실패</button>
        </div>
        <div id="smallBtns">
          <button class="btn sm" id="bReset">리셋</button>
          <button class="btn sm" id="bClear">칸 초기화</button>
          <button class="btn sm" id="bHome">처음으로</button>
        </div>
        <div id="rightBtns">
          <button class="btn" id="bUndo" disabled>되돌리기</button>
          <button class="btn" id="bManual">수기입력</button>
        </div>
      </div>
    </div>
    <div id="board"></div>
  </div>
</div>

<script>
/* ---------- 화면 맞춤 (1920x1080 고정 스테이지를 창 크기에 맞춰 축소/확대) ---------- */
const stage=document.getElementById('stage');
function fit(){
  const s=Math.min(innerWidth/1920,innerHeight/1080);
  stage.style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`;
}
addEventListener('resize',fit);fit();

/* ---------- 상수 ---------- */
const COLORS=[
  {bg:'#ffff00',fg:'#000'},{bg:'#92d050',fg:'#000'},{bg:'#00b0f0',fg:'#000'},
  {bg:'#ff0000',fg:'#fff'},{bg:'#ff9a1f',fg:'#000'},{bg:'#b17bdc',fg:'#fff'}
];
const EVENTS=[
  {name:['쥐볼','놀이','짧게'],sub:'',type:'time'},
  {name:['쥐볼','놀이','길게'],sub:'',type:'time'},
  {name:['카우','보이','오래'],sub:'',type:'time'},
  {name:['카우','보이','많이'],sub:'',type:'count'}
];

/* ---------- 설정 화면 ---------- */
const teamGrid=document.getElementById('teamGrid');
for(let i=0;i<6;i++){
  const d=document.createElement('div');d.className='team-in';
  d.innerHTML=`<div class="dot" style="background:${COLORS[i].bg};color:${COLORS[i].fg}">${i+1}</div>
    <input type="text" maxlength="12" placeholder="팀 ${i+1}" autocomplete="off">`;
  teamGrid.appendChild(d);
}
const inputs=[...teamGrid.querySelectorAll('input')];
const NAME_RE=/[^a-zA-Z0-9ㄱ-ㅎㅏ-ㅣ가-힣 ]/g;
inputs.forEach(inp=>inp.addEventListener('input',()=>{
  const v=inp.value.replace(NAME_RE,'');
  if(v!==inp.value)inp.value=v;
}));
const msg=document.getElementById('msg');

const MAXP=5;                       // 종목별·팀별 최대 참가자 수
const newEntry=()=>({rec:null,fail:false});
let mode='best',teams=[],players=[],data=[],sel=null;
// data[e][t][k] = 종목 e, 팀 t, k번째 기록 (최고점 방식은 k=0 하나, 전체기록 방식은 참가자 수만큼)

document.getElementById('goBtn').onclick=()=>{
  const names=inputs.map(i=>i.value.trim()).filter(v=>v);
  if(names.length<2){msg.textContent='팀 이름을 2개 이상 입력해 주세요.';return}
  msg.textContent='';
  teams=names.map((n,i)=>({name:n,c:COLORS[i]}));
  mode=document.querySelector('input[name=mode]:checked').value;
  if(mode==='all'){buildNames();show('namesScreen');return}
  startBoard();
};
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}

function startBoard(){
  data=EVENTS.map((_,e)=>teams.map((_,t)=>mode==='all'?players[e][t].map(newEntry):[newEntry()]));
  sel=null;undoStack=[];lastMeasure=null;runCell=null;bUndo.disabled=true;
  resetSW();setManual(false);
  document.getElementById('modeTxt').textContent=mode==='all'?'전체기록 방식':'최고점 방식';
  buildBoard();
  show('boardScreen');
  fitAll();
}

/* ---------- 참가자 이름 입력 (전체기록 방식) ---------- */
const nameGrid=document.getElementById('nameGrid');
const nmsg=document.getElementById('nmsg');
let nameDraft={};
function buildNames(){
  nmsg.textContent='';
  nameGrid.style.gridTemplateColumns=`170px repeat(${teams.length},minmax(0,1fr))`;
  let h=`<div class="c corner"><span class="t">팀</span><span class="j">종목</span></div>`;
  teams.forEach(t=>h+=`<div class="c th" style="background:${t.c.bg};color:${t.c.fg}">${esc(t.name)}</div>`);
  EVENTS.forEach((ev,e)=>{
    const rc='r'+(e%2);
    h+=`<div class="c ev ${rc}">${ev.name.map(x=>`<div>${x}</div>`).join('')}</div>`;
    teams.forEach((t,ti)=>{
      h+=`<div class="ncell ${rc}">`;
      for(let k=0;k<MAXP;k++){
        const key=`${e}|${ti}|${k}`;
        h+=`<input type="text" maxlength="8" placeholder="참가자 ${k+1}" autocomplete="off" data-key="${key}" value="${esc(nameDraft[key]||'')}">`;
      }
      h+='</div>';
    });
  });
  nameGrid.innerHTML=h;
  const ins=[...nameGrid.querySelectorAll('input')];
  ins.forEach((inp,i)=>{
    inp.oninput=()=>{
      const v=inp.value.replace(NAME_RE,'');
      if(v!==inp.value)inp.value=v;
      nameDraft[inp.dataset.key]=inp.value;
    };
    inp.onkeydown=ev=>{
      if(ev.key==='Enter'){ev.preventDefault();(ins[i+1]||inp).focus()}
    };
  });
}
document.getElementById('nBack').onclick=()=>show('setup');
document.getElementById('nGo').onclick=()=>{
  const ins=[...nameGrid.querySelectorAll('input')];
  ins.forEach(i=>nameDraft[i.dataset.key]=i.value);
  players=EVENTS.map((_,e)=>teams.map((_,t)=>{
    const a=[];
    for(let k=0;k<MAXP;k++){const v=(nameDraft[`${e}|${t}|${k}`]||'').trim();if(v)a.push(v)}
    return a;
  }));
  if(!players.some(r=>r.some(a=>a.length))){nmsg.textContent='참가자를 한 명 이상 입력해 주세요.';return}
  startBoard();
};

/* ---------- 순위/점수 (최고점 방식 전용) ---------- */
function calc(){
  const N=teams.length;
  const pts=EVENTS.map((_,e)=>{
    const arr=data[e].map((d,t)=>({t,v:d[0].rec})).filter(x=>x.v!==null).sort((a,b)=>b.v-a.v);
    const p=teams.map(()=>0);
    arr.forEach((x,i)=>{
      const first=arr.findIndex(y=>y.v===x.v);   // 동점은 같은 점수
      p[x.t]=N-first;
    });
    return p;
  });
  const tot=teams.map((_,t)=>pts.reduce((s,r)=>s+r[t],0));
  return {pts,tot};
}
function fmt(ms){
  const cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000)%60,m=Math.floor(ms/60000);
  return String(m)+':'+String(s).padStart(2,'0')+'.'+String(cs).padStart(2,'0');
}
const recText=(ev,d)=>d.rec!==null?(ev.type==='count'?d.rec:fmt(d.rec)):(d.fail?'-':'');

/* ---------- 점수판 그리기 ---------- */
const board=document.getElementById('board');
function buildBoard(){
  const n=teams.length;
  board.style.gridTemplateColumns=`170px repeat(${n},minmax(0,1fr))`;
  board.style.gridTemplateRows=mode==='all'?`120px repeat(4,minmax(0,1fr))`:`120px repeat(4,minmax(0,1fr)) 105px`;
  board.style.setProperty('--ptw',n>=5?'80px':'92px');
  render();
}
function headHtml(){
  let h=`<div class="c corner"><span class="t">팀</span><span class="j">종목</span></div>`;
  teams.forEach(t=>h+=`<div class="c th" style="background:${t.c.bg};color:${t.c.fg}">${esc(t.name)}</div>`);
  return h;
}
const evHtml=(ev,rc)=>`<div class="c ev ${rc}">${ev.name.map(x=>`<div>${x}</div>`).join('')}${ev.sub?`<small>${ev.sub}</small>`:''}</div>`;
function recHtmlOf(ev,d,e,t,k){
  const val=recText(ev,d);
  return ev.type==='count'
    ?`<div class="rec"><input inputmode="numeric" value="${val}" data-e="${e}" data-t="${t}" data-k="${k}"></div>`
    :`<div class="rec">${val}</div>`;
}
function render(){
  if(mode==='all'){renderAll();return}
  const {pts,tot}=calc();
  let h=headHtml();
  EVENTS.forEach((ev,e)=>{
    const rc='r'+(e%2);
    h+=evHtml(ev,rc);
    teams.forEach((t,ti)=>{
      const d=data[e][ti][0];
      const isSel=sel&&sel.e===e&&sel.t===ti;
      const pv=(d.rec!==null||d.fail)?pts[e][ti]:'';
      h+=`<div class="c ${rc} pair cell unit ${isSel?'sel':''}" data-e="${e}" data-t="${ti}" data-k="0">${recHtmlOf(ev,d,e,ti,0)}<div class="pt">${pv}</div></div>`;
    });
  });
  h+=`<div class="c tot r0">합계</div>`;
  teams.forEach((t,ti)=>h+=`<div class="c pair r0"><div class="rec"></div><div class="pt totv">${tot[ti]}</div></div>`);
  board.innerHTML=h;
  bindInputs();
  updateSelLabel();
}
function renderAll(){
  let h=headHtml();
  EVENTS.forEach((ev,e)=>{
    const rc='r'+(e%2);
    h+=evHtml(ev,rc);
    teams.forEach((t,ti)=>{
      const list=players[e][ti];
      if(!list.length){h+=`<div class="c pcell empty ${rc}">참가자 없음</div>`;return}
      h+=`<div class="c pcell ${rc}" style="grid-template-rows:repeat(${list.length},minmax(0,1fr))">`;
      list.forEach((nm,k)=>{
        const d=data[e][ti][k];
        const isSel=sel&&sel.e===e&&sel.t===ti&&sel.k===k;
        h+=`<div class="prow unit ${isSel?'sel':''}" data-e="${e}" data-t="${ti}" data-k="${k}"><div class="pname" title="${esc(nm)}">${esc(nm)}</div>${recHtmlOf(ev,d,e,ti,k)}</div>`;
      });
      h+='</div>';
    });
  });
  board.innerHTML=h;
  bindInputs();
  updateSelLabel();
  fitCells();
}
function bindInputs(){
  board.querySelectorAll('input').forEach(inp=>{
    inp.onkeydown=ev=>{if(ev.key==='Enter')inp.blur()};
    inp.oninput=()=>{inp.value=inp.value.replace(/[^0-9-]/g,'')};
    inp.onchange=()=>commitCount(+inp.dataset.e,+inp.dataset.t,+inp.dataset.k,inp.value.trim());
  });
}
function updateSelLabel(){
  let t='없음';
  if(sel){
    t=`${EVENTS[sel.e].name.join('')}·${teams[sel.t].name}`;
    if(mode==='all')t+=`·${players[sel.e][sel.t][sel.k]}`;
  }
  document.getElementById('sel').textContent=t;
}
board.addEventListener('click',ev=>{
  if(ev.target.tagName==='INPUT')return;
  const u=ev.target.closest('.unit');
  if(!u)return;
  const e=+u.dataset.e,t=+u.dataset.t,k=+u.dataset.k;
  selectCell(e,t,k);
  if(manualMode&&EVENTS[e].type==='time')openManual(u,e,t,k);
});

/* '0:00.00' 글자 폭 측정 (100px 기준) */
function timeW100(){
  const m=document.createElement('span');
  m.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;font-weight:800;font-size:100px;font-variant-numeric:tabular-nums;font-family:inherit';
  m.textContent='0:00.00';
  stage.appendChild(m);
  const w=m.getBoundingClientRect().width/(stage.getBoundingClientRect().width/1920);
  stage.removeChild(m);
  return w;
}
/* 최고점 방식: 팀 수에 맞춰 정해진 기록칸 폭에 '0:00.00'이 들어가도록 글자 크기를 한 번 계산 */
function fitFont(){
  const rec=board.querySelector('.cell .rec');
  if(!rec)return;
  const recW=rec.clientWidth;
  const fs=Math.max(14,Math.min(70,Math.floor((recW-24)/timeW100()*100)));
  board.style.setProperty('--recfs',fs+'px');
}
/* 전체기록 방식: 칸(팀×종목)의 크기와 참가자 수에 맞춰 이름·기록 글자 크기를 계산 */
function fitCells(){
  const w100=timeW100();
  board.querySelectorAll('.pcell:not(.empty)').forEach(c=>{
    const n=c.children.length,H=c.clientHeight,W=c.clientWidth;
    if(!H||!W)return;
    const gap=3,subH=(H-(n-1)*gap)/n;
    const recW=W*0.58-gap,nameW=W*0.42-gap;
    const rfs=Math.floor(Math.min(subH*0.64,60,(recW-10)/w100*100));
    let L=2;c.querySelectorAll('.pname').forEach(x=>{L=Math.max(L,x.textContent.length)});
    const nfs=Math.floor(Math.min(subH*0.6,34,(nameW-12)/L));
    c.style.setProperty('--rfs',Math.max(10,rfs)+'px');
    c.style.setProperty('--nfs',Math.max(10,nfs)+'px');
  });
}
function fitAll(){ if(mode==='all')fitCells(); else fitFont(); }
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ---------- 선택 / 입력 ---------- */
function hint(t){const h=document.getElementById('swHint');h.textContent=t;clearTimeout(hint.t);if(t)hint.t=setTimeout(()=>h.textContent='',2500)}
const same=(a,e,t,k)=>a&&a.e===e&&a.t===t&&a.k===k;
function selectCell(e,t,k){
  if(running&&!manualMode){hint('측정 중에는 칸을 바꿀 수 없습니다.');return}
  if(!same(sel,e,t,k))lastMeasure=null;
  sel={e,t,k};
  board.querySelectorAll('.unit').forEach(c=>c.classList.toggle('sel',+c.dataset.e===e&&+c.dataset.t===t&&+c.dataset.k===k));
  updateSelLabel();
  if(EVENTS[e].type==='count'){
    const inp=board.querySelector(`input[data-e="${e}"][data-t="${t}"][data-k="${k}"]`);
    if(inp){inp.focus();inp.select()}
  }
}
/* 되돌리기: 최근 변경을 최대 30단계까지 저장 */
const UNDO_MAX=30;
let undoStack=[],lastMeasure=null,manualMode=false,runCell=null;
const bUndo=document.getElementById('bUndo');
function mutate(fn){
  const before=JSON.stringify(data);
  fn();
  if(JSON.stringify(data)!==before){undoStack.push(before);if(undoStack.length>UNDO_MAX)undoStack.shift();bUndo.disabled=false}
}
function commitCount(e,t,k,v){
  const d=data[e][t][k];
  mutate(()=>{
    if(v===''||v==='-'){ if(v==='-'&&d.rec===null)d.fail=true; }
    else{
      const n=parseInt(v,10);
      if(!isNaN(n)&&(d.rec===null||n>d.rec)){d.rec=n;d.fail=false}
    }
  });
  render();
}

/* ---------- 스톱워치 ---------- */
let running=false,t0=0,elapsed=0,raf=0;
const swTime=document.getElementById('swTime');
const MAX_MS=10*60*1000;
function tick(){
  elapsed=performance.now()-t0;
  if(elapsed>=MAX_MS){            // 10분 초과: 0:00.00으로 돌아가며 정지 (기록하지 않음)
    resetSW();hint('10분을 넘어 스톱워치가 멈췄습니다. 기록되지 않았습니다.');return;
  }
  swTime.textContent=fmt(elapsed);raf=requestAnimationFrame(tick);
}
function resetSW(){cancelAnimationFrame(raf);running=false;elapsed=0;swTime.textContent='0:00.00';swTime.classList.remove('run');if(typeof setToggle==='function')setToggle()}

const bToggle=document.getElementById('bToggle');
function setToggle(){bToggle.textContent=running?'정지':'시작';bToggle.classList.toggle('run',running)}
bToggle.onclick=()=>{
  if(!running){
    if(!sel){hint('먼저 기록칸을 선택하세요.');return}
    if(EVENTS[sel.e].type==='count'){hint('카우보이많이는 숫자를 직접 입력하세요.');return}
    lastMeasure=null;runCell={e:sel.e,t:sel.t,k:sel.k};
    elapsed=0;t0=performance.now();running=true;swTime.classList.add('run');setToggle();tick();
  }else{
    cancelAnimationFrame(raf);elapsed=performance.now()-t0;running=false;
    swTime.textContent=fmt(elapsed);swTime.classList.remove('run');setToggle();
    const rc=runCell||sel;
    const d=data[rc.e][rc.t][rc.k];
    lastMeasure={e:rc.e,t:rc.t,k:rc.k,rec:d.rec,fail:d.fail};   // 이 측정 직전의 기록 보관
    mutate(()=>{ if(d.rec===null||elapsed>d.rec){d.rec=Math.round(elapsed);d.fail=false} });
    sel={e:rc.e,t:rc.t,k:rc.k};
    render();
  }
};
/* ---------- 수기입력 ---------- */
const bManual=document.getElementById('bManual');
function setManual(on){
  manualMode=on;
  bManual.classList.toggle('on',on);
  bManual.textContent=on?'수기입력 ON':'수기입력';
  board.classList.toggle('manual',on);
}
bManual.onclick=()=>{
  setManual(!manualMode);
  hint(manualMode?'수기입력 ON: 시간 칸을 클릭해 숫자를 입력하고 Enter':'수기입력을 껐습니다.');
};
function fmtDigits(d){const p=d.padStart(5,'0');return (+p[0])+':'+p.slice(1,3)+'.'+p.slice(3)}
function openManual(unit,e,t,k){
  const rec=unit.querySelector('.rec');
  if(!rec||rec.querySelector('input'))return;
  const orig=rec.innerHTML;
  rec.innerHTML='<input class="mi" inputmode="numeric" autocomplete="off">';
  const inp=rec.firstChild;
  let digits='';
  const show=()=>{inp.value=fmtDigits(digits);inp.setSelectionRange(inp.value.length,inp.value.length)};
  show();inp.focus();
  hint('숫자만 입력하면 분:초.센티초로 채워집니다. Enter=기록, Esc=취소');
  let done=false;
  const close=()=>{if(done)return;done=true;rec.innerHTML=orig};
  inp.oninput=()=>{digits=inp.value.replace(/\D/g,'').replace(/^0+/,'').slice(-5);show()};
  inp.onkeydown=ev=>{
    if(ev.key==='Escape'){close();return}
    if(ev.key!=='Enter')return;
    const p=digits.padStart(5,'0');
    const m=+p[0],sec=+p.slice(1,3),cs=+p.slice(3);
    if(sec>=60){hint('초는 59 이하로 입력하세요.');return}
    const ms=(m*60+sec)*1000+cs*10;
    if(ms<=0){hint('0보다 큰 시간을 입력하세요.');return}
    done=true;
    const d=data[e][t][k];
    lastMeasure={e,t,k,rec:d.rec,fail:d.fail};
    mutate(()=>{ if(d.rec===null||ms>d.rec){d.rec=ms;d.fail=false} });
    render();
  };
  inp.onblur=close;
}
document.getElementById('bReset').onclick=()=>resetSW();
/* 실패: 측정 중이면 폐기 / 방금 정지로 기록된 값이 있으면 그 기록을 지우고 이전 기록으로 복원 */
document.getElementById('bFail').onclick=()=>{
  if(!sel){hint('먼저 기록칸을 선택하세요.');return}
  const wasRunning=running;
  resetSW();
  mutate(()=>{
    const d=data[sel.e][sel.t][sel.k];
    if(!wasRunning&&same(lastMeasure,sel.e,sel.t,sel.k)){
      d.rec=lastMeasure.rec;d.fail=lastMeasure.fail;     // 방금 측정값 삭제 → 이전 기록 복원
    }
    if(d.rec===null)d.fail=true;                          // 이전 기록이 없으면 '-'
  });
  lastMeasure=null;
  render();
};
document.getElementById('bClear').onclick=()=>{
  if(!sel){hint('초기화할 칸을 선택하세요.');return}
  if(running)resetSW();
  lastMeasure=null;
  mutate(()=>{data[sel.e][sel.t][sel.k]=newEntry()});
  render();
};
bUndo.onclick=()=>{
  if(!undoStack.length)return;
  if(running)resetSW();
  data=JSON.parse(undoStack.pop());lastMeasure=null;bUndo.disabled=!undoStack.length;
  render();hint('직전 변경을 되돌렸습니다.');
};
document.getElementById('bHome').onclick=()=>{
  resetSW();setManual(false);sel=null;teams=[];players=[];data=[];undoStack=[];lastMeasure=null;runCell=null;nameDraft={};bUndo.disabled=true;board.innerHTML='';
  inputs.forEach(i=>i.value='');msg.textContent='';
  show('setup');
};
</script>
</body>
