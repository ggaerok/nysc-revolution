<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>회전하는 물체 그리고 공전 - 점수판</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--ink:#2b3553;--ink2:#5d6b8f;--line:#4b5a8c;--r0:#e6f0ff;--r1:#f4edff;--pt:#d6456b}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:linear-gradient(135deg,#ebe5ff,#ddeeff 50%,#e1f7ee);font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:var(--ink);user-select:none}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#e7e9fb;overflow:hidden}
  #bg{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}
  .screen{position:absolute;inset:0;display:none}
  .screen.on{display:block}
  .deco{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}
  .logo{width:1em;height:1em;flex:none}
  .gt{background:linear-gradient(90deg,#5b61d6,#9163d8 55%,#e46b9f);-webkit-background-clip:text;background-clip:text;color:transparent}

  /* ---------- 설정 화면 ---------- */
  #setup .card{position:absolute;left:310px;top:70px;width:1300px;height:940px;background:rgba(255,255,255,.88);border:3px solid #fff;border-radius:36px;padding:44px 70px;box-shadow:0 18px 50px rgba(110,100,200,.28),0 0 0 8px rgba(255,255,255,.35)}
  #setup h1{display:flex;align-items:center;justify-content:center;gap:16px;font-size:62px;line-height:1.15;letter-spacing:2px}
  #setup h2{display:table;margin:10px auto 0;background:#ebe7ff;color:#5b55b8;padding:4px 26px;border-radius:999px;font-size:24px;font-weight:700}
  .sec-title{font-size:32px;font-weight:800;margin:34px 0 14px;color:#5b55b8}
  .sec-title small{font-size:22px;color:#7f8bb0;font-weight:500}
  .team-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 22px}
  .team-in{min-width:0;overflow:hidden;display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:6px 14px 6px 8px;box-shadow:inset 0 0 0 3px #dcd7f7,0 4px 10px rgba(120,110,200,.12)}
  .team-in .dot{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:var(--ink);flex:none;box-shadow:inset 0 0 0 2px rgba(75,90,140,.25)}
  .team-in input{flex:1 1 0;width:0;min-width:0;background:transparent;border:0;outline:0;color:var(--ink);font-size:34px;font-family:inherit;padding:10px 4px;user-select:text}
  .team-in input::placeholder{color:#b3b9d6}
  .team-in:focus-within{box-shadow:inset 0 0 0 3px #8c7be8,0 0 0 5px rgba(140,123,232,.25)}
  .modes{display:flex;gap:26px}
  .mode{flex:1;display:block;cursor:pointer}
  .mode input{display:none}
  .mode .box{border:4px solid #d9ddf3;border-radius:22px;padding:22px 26px;background:#fff;height:170px;transition:background .15s,border-color .15s}
  .mode:hover .box{border-color:#bfb6f2}
  .mode .box b{display:block;font-size:36px;margin-bottom:8px;color:var(--ink)}
  .mode .box span{font-size:22px;color:#6d7aa0;line-height:1.4}
  .mode input:checked + .box{border-color:#8c7be8;background:#f3efff;box-shadow:0 8px 18px rgba(140,123,232,.25)}
  #msg{height:36px;margin-top:20px;text-align:center;font-size:26px;color:#e0605f;font-weight:700}
  #goBtn{display:block;margin:6px auto 0;width:520px;height:100px;border:0;border-radius:24px;background:linear-gradient(135deg,#a9dcff,#c6b6ff);color:var(--ink);font-size:46px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 6px 0 rgba(120,110,200,.3),0 12px 22px rgba(120,110,200,.2)}
  #goBtn:hover{filter:brightness(1.05)}
  #goBtn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(120,110,200,.3)}

  /* ---------- 점수판 화면 ---------- */
  #topbar{position:absolute;left:20px;top:10px;width:1880px;height:165px}
  #ttl{position:absolute;left:6px;top:14px;width:720px}
  #ttl h1{display:flex;align-items:center;gap:12px;font-size:50px;line-height:1.15;letter-spacing:1px}
  #ttl p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{display:flex;gap:10px;margin-top:10px;font-size:24px;min-width:0}
  .chip{flex:none;background:#e3deff;color:#5b55b8;font-weight:800;padding:3px 18px;border-radius:999px}
  .chip2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#fff;color:var(--ink2);padding:3px 18px;border-radius:999px;box-shadow:inset 0 0 0 2px #dcd7f7}
  #sel{color:var(--pt);font-weight:800}
  #ttl #swHint{font-size:22px;color:#c8641c;height:28px;margin-top:4px;font-weight:700}
  #sw{position:absolute;right:0;top:0;width:1120px;height:165px;background:#fff;border-radius:26px;padding:16px 20px;display:flex;align-items:stretch;gap:16px;box-shadow:inset 0 0 0 3px #e0dcf8,0 10px 26px rgba(110,100,200,.2)}
  #swTime{width:360px;background:linear-gradient(180deg,#f6f3ff,#e6f2ff);border-radius:18px;font-size:88px;font-weight:800;text-align:center;line-height:133px;font-variant-numeric:tabular-nums;letter-spacing:1px;color:#5a5fd0;flex:none;box-shadow:inset 0 0 0 3px #d3d6f7}
  #swTime.run{color:#ef6c3e}
  #bigBtns{display:flex;gap:10px;flex:none}
  .btn{border:0;border-radius:16px;font-weight:800;cursor:pointer;font-family:inherit;color:var(--ink);box-shadow:0 4px 0 rgba(75,90,140,.2),0 7px 12px rgba(75,90,140,.1);transition:filter .15s}
  .btn:hover:not(:disabled){filter:brightness(1.04)}
  .btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(75,90,140,.2)}
  .btn.big{width:185px;font-size:44px}
  #smallBtns{display:flex;flex-direction:column;gap:7px;width:128px;flex:none}
  .btn.sm{flex:1;font-size:21px;border-radius:12px}
  #rightBtns{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
  #rightBtns .btn{flex:1;font-size:24px}
  #bToggle{background:#b5ead7;color:#1d5c46}#bToggle.run{background:#ffe29a;color:#7a5200}
  #bFail{background:#ffb8c1;color:#8f1d33}
  #bReset{background:#dfe2f7;color:#3d4570}#bClear{background:#e6d6fa;color:#5a2f86}#bHome{background:#cfe6f8;color:#25507a}
  #bUndo{background:#bcd9ff;color:#1f4f8f}
  #bUndo:disabled{background:#e9edf5;color:#a3adc0;cursor:not-allowed;box-shadow:none}
  #bManual{background:#ffd9b8;color:#8a4a10}
  #bManual.on{background:#ffb866;color:#4a2500;box-shadow:inset 0 0 0 4px #d97a1a,0 4px 0 rgba(75,90,140,.2)}
  .manual .unit .rec{cursor:text}

  #board{position:absolute;left:20px;top:190px;width:1880px;height:876px;background:var(--line);padding:6px;display:grid;gap:6px;border-radius:18px;overflow:hidden;box-shadow:0 10px 28px rgba(75,90,140,.3)}
  .c{display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;color:var(--ink);overflow:hidden}
  .corner{background:#c6e5f7;position:relative;color:var(--ink);
    background-image:linear-gradient(to top right,transparent calc(50% - 2px),var(--line) calc(50% - 2px),var(--line) calc(50% + 2px),transparent calc(50% + 2px))}
  .corner .t{position:absolute;right:14px;top:10px;font-size:34px}
  .corner .j{position:absolute;left:14px;bottom:10px;font-size:34px}
  .th{font-size:44px}
  .ev{flex-direction:column;font-size:38px;line-height:1.18}
  .ev.r0{background:#d5e3ff}.ev.r1{background:#e7dcff}
  .ev small{font-size:24px;font-weight:700;margin-top:4px}
  .r0{background:var(--r0)}.r1{background:var(--r1)}
  .pair{display:grid;grid-template-columns:minmax(0,1fr) var(--ptw,92px);grid-template-rows:minmax(0,1fr);gap:6px;min-width:0;min-height:0;background:var(--line);align-items:stretch;justify-content:stretch}
  .rec,.pt{display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink)}
  .rec{font-size:var(--recfs,70px);font-variant-numeric:tabular-nums;cursor:pointer;position:relative;white-space:nowrap;overflow:hidden;min-width:0}
  .pt{font-size:56px;color:var(--pt)}
  .r0 .rec,.r0 .pt{background:var(--r0)}.r1 .rec,.r1 .pt{background:var(--r1)}
  .unit{cursor:pointer}
  .unit.sel .rec,.unit.sel .pt,.unit.sel .pname{background:#fff2a8}
  .unit.sel .rec{box-shadow:inset 0 0 0 var(--selw,8px) #ff5a5f}
  .rec.best{color:#0b5fb0}
  .rec input{width:100%;height:100%;border:0;background:transparent;text-align:center;font-size:var(--recfs,70px);font-weight:800;font-family:inherit;color:var(--ink);outline:0;user-select:text}
  /* 전체기록 방식: 팀×종목 칸을 참가자 수만큼 나눔 */
  .pcell{display:grid;gap:3px;background:var(--line);min-height:0;min-width:0;align-items:stretch;justify-content:stretch;--selw:4px}
  .pcell.empty{display:flex;align-items:center;justify-content:center;color:#8a96b8;font-size:22px;font-weight:700;background:var(--r0)}
  .pcell.r1.empty{background:var(--r1)}
  .prow{display:grid;grid-template-columns:42% minmax(0,1fr);gap:3px;min-height:0;min-width:0;background:var(--line)}
  .pname{display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink);font-size:var(--nfs,20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;min-width:0}
  .r0 .pname{background:var(--r0)}.r1 .pname{background:var(--r1)}
  /* 전체기록 방식: 종목의 모든 칸이 입력되면 최고 기록을 붉게 표시 (이름 글자는 검은색 유지) */
  .prow.top .rec{color:#e60000}
  .prow.top .rec,.prow.top .pname{box-shadow:inset 0 0 0 3px #e60000}
  .pcell .rec{font-size:var(--rfs,24px)}
  .pcell .rec input{font-size:var(--rfs,24px)}
  .tot{font-size:40px}
  .totv{font-size:64px;color:var(--pt)}

  /* ---------- 참가자 이름 입력 화면 ---------- */
  #ntop{position:absolute;left:26px;top:10px;width:1868px;height:140px}
  #ntitle h1{font-size:46px;letter-spacing:1px}
  #ntitle p{font-size:22px;color:var(--ink2);margin-top:4px}
  #ntitle #nmsg{color:#d9534f;font-weight:700;height:28px}
  #nbtns{position:absolute;right:0;top:10px;display:flex;gap:14px}
  #nbtns .btn{height:90px;font-size:38px}
  #nBack{width:160px;background:#dfe2f7;color:#3d4570}
  #nGo{width:320px;background:linear-gradient(135deg,#a9dcff,#c6b6ff);color:var(--ink)}
  #nameGrid{position:absolute;left:20px;top:162px;width:1880px;height:900px;background:var(--line);padding:6px;display:grid;gap:6px;grid-template-rows:90px repeat(4,minmax(0,1fr));border-radius:18px;overflow:hidden;box-shadow:0 10px 28px rgba(75,90,140,.3)}
  #nameGrid .th{font-size:36px}
  #nameGrid .ev{font-size:34px}
  .ncell{display:flex;flex-direction:column;gap:4px;padding:5px;min-height:0;min-width:0}
  .ncell.r0{background:var(--r0)}.ncell.r1{background:var(--r1)}
  .ncell input{flex:1;min-height:0;min-width:0;width:100%;border:2px solid #b9c4e8;border-radius:8px;background:#fff;color:var(--ink);font-size:21px;font-weight:700;font-family:inherit;padding:0 10px;outline:0;user-select:text}
  .ncell input:focus{border-color:#8c7be8;background:#faf8ff}
  .ncell input::placeholder{color:#b3bad3;font-weight:400}
</style>
</head>
<body>
<div id="stage">

  <!-- 배경: 파스텔 우주 -->
  <svg id="bg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="gSky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ebe5ff"/><stop offset=".5" stop-color="#ddeeff"/><stop offset="1" stop-color="#e1f7ee"/></linearGradient>
      <radialGradient id="gG1"><stop offset="0" stop-color="#ffd3e8" stop-opacity=".75"/><stop offset="1" stop-color="#ffd3e8" stop-opacity="0"/></radialGradient>
      <radialGradient id="gG2"><stop offset="0" stop-color="#c3f1e0" stop-opacity=".8"/><stop offset="1" stop-color="#c3f1e0" stop-opacity="0"/></radialGradient>
      <radialGradient id="gG3"><stop offset="0" stop-color="#d4c9ff" stop-opacity=".8"/><stop offset="1" stop-color="#d4c9ff" stop-opacity="0"/></radialGradient>
      <radialGradient id="gG4"><stop offset="0" stop-color="#c4e4ff" stop-opacity=".85"/><stop offset="1" stop-color="#c4e4ff" stop-opacity="0"/></radialGradient>
      <symbol id="sp" viewBox="-16 -16 32 32"><path d="M0,-15 C2,-5 5,-2 15,0 C5,2 2,5 0,15 C-2,5 -5,2 -15,0 C-5,-2 -2,-5 0,-15Z"/></symbol>
    </defs>
    <rect width="1920" height="1080" fill="url(#gSky)"/>
    <circle cx="280" cy="170" r="430" fill="url(#gG1)"/>
    <circle cx="1680" cy="930" r="470" fill="url(#gG2)"/>
    <circle cx="1560" cy="120" r="400" fill="url(#gG3)"/>
    <circle cx="180" cy="930" r="420" fill="url(#gG4)"/>
    <g fill="none" stroke="#b7b2ee" stroke-width="2" stroke-dasharray="3 12" stroke-linecap="round" opacity=".65">
      <ellipse cx="960" cy="540" rx="930" ry="430" transform="rotate(-12 960 540)"/>
      <ellipse cx="960" cy="540" rx="760" ry="330" transform="rotate(-12 960 540)"/>
    </g>
    <g opacity=".85">
      <use href="#sp" x="1000" y="30" width="34" height="34" fill="#ffd86b"/>
      <use href="#sp" x="1300" y="150" width="22" height="22" fill="#8fd3f4"/>
      <use href="#sp" x="1500" y="40" width="28" height="28" fill="#ff9ec4"/>
      <use href="#sp" x="1860" y="110" width="26" height="26" fill="#b3a4f5"/>
      <use href="#sp" x="40" y="430" width="24" height="24" fill="#8fd3f4"/>
      <use href="#sp" x="1880" y="520" width="30" height="30" fill="#ffd86b"/>
      <use href="#sp" x="30" y="760" width="26" height="26" fill="#ff9ec4"/>
      <use href="#sp" x="1890" y="800" width="22" height="22" fill="#8fd3f4"/>
      <use href="#sp" x="420" y="1060" width="24" height="24" fill="#b3a4f5"/>
      <use href="#sp" x="1100" y="1066" width="30" height="30" fill="#ffd86b"/>
      <use href="#sp" x="1500" y="1062" width="22" height="22" fill="#ff9ec4"/>
    </g>
    <g opacity=".8">
      <circle cx="880" cy="60" r="4" fill="#ffd86b"/><circle cx="1180" cy="90" r="3" fill="#b3a4f5"/>
      <circle cx="1400" cy="60" r="4" fill="#8fd3f4"/><circle cx="1700" cy="150" r="3" fill="#ffd86b"/>
      <circle cx="12" cy="300" r="4" fill="#b3a4f5"/><circle cx="1906" cy="330" r="4" fill="#ff9ec4"/>
      <circle cx="14" cy="600" r="3" fill="#ffd86b"/><circle cx="1904" cy="660" r="3" fill="#8fd3f4"/>
      <circle cx="700" cy="1072" r="4" fill="#8fd3f4"/><circle cx="1300" cy="1070" r="3" fill="#b3a4f5"/>
    </g>
  </svg>


  <!-- ===== 첫 화면 ===== -->
  <div id="setup" class="screen on">
    <svg class="deco" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="gPA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc9a8"/><stop offset="1" stop-color="#ff9ec4"/></linearGradient>
        <linearGradient id="gPB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9ccff"/><stop offset="1" stop-color="#a9c9ff"/></linearGradient>
        <linearGradient id="gPC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a8"/><stop offset="1" stop-color="#ffc98a"/></linearGradient>
        <linearGradient id="gComet" gradientUnits="userSpaceOnUse" x1="1860" y1="40" x2="1640" y2="125"><stop offset="0" stop-color="#ffe48a"/><stop offset="1" stop-color="#ffe48a" stop-opacity="0"/></linearGradient>
        <clipPath id="cE"><circle r="95"/></clipPath>
      </defs>
      <!-- 고리 행성 (좌상) -->
      <g transform="translate(120 215) rotate(-18)">
        <ellipse rx="150" ry="36" fill="none" stroke="#ffe0bd" stroke-width="16"/>
        <circle r="82" fill="url(#gPA)"/>
        <path d="M-78,-24 Q0,-4 78,-24" stroke="#fff" stroke-opacity=".4" stroke-width="10" fill="none"/>
        <path d="M-80,14 Q0,34 80,14" stroke="#fff" stroke-opacity=".3" stroke-width="8" fill="none"/>
        <path d="M-150,0 A150,36 0 0 0 150,0" fill="none" stroke="#ffc58a" stroke-width="16"/>
      </g>
      <!-- 초승달 -->
      <g transform="translate(232 520) rotate(-25)"><path d="M0,-50 A50,50 0 0 0 0,50 A64,64 0 0 1 0,-50Z" fill="#fff0a8" stroke="#ffe08a" stroke-width="3"/></g>
      <!-- 지구 느낌의 행성 (좌하) -->
      <g transform="translate(135 905)">
        <circle r="95" fill="#a9dcff"/>
        <g clip-path="url(#cE)">
          <path d="M-62,-30 C-32,-72 12,-52 2,-14 C-8,12 -52,22 -62,-30Z" fill="#c6f0d2"/>
          <path d="M22,22 C62,0 88,32 62,62 C40,84 10,62 22,22Z" fill="#c6f0d2"/>
          <path d="M-30,52 C-10,40 6,60 -6,76 C-20,86 -40,70 -30,52Z" fill="#c6f0d2"/>
          <ellipse cx="-20" cy="-60" rx="34" ry="9" fill="#fff" opacity=".6"/>
          <ellipse cx="40" cy="-8" rx="28" ry="8" fill="#fff" opacity=".6"/>
        </g>
        <circle r="95" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="5"/>
      </g>
      <!-- 우상: 혜성 + 보라 행성 -->
      <path d="M1860,40 L1640,125" stroke="url(#gComet)" stroke-width="12" stroke-linecap="round"/>
      <circle cx="1860" cy="40" r="10" fill="#fff6c4"/>
      <g transform="translate(1790 270)">
        <circle r="72" fill="url(#gPB)"/>
        <circle cx="-22" cy="-18" r="14" fill="#fff" opacity=".35"/><circle cx="24" cy="20" r="10" fill="#fff" opacity=".3"/><circle cx="-6" cy="34" r="7" fill="#fff" opacity=".3"/>
      </g>
      <circle cx="1690" cy="190" r="18" fill="#ffd1e3"/>
      <!-- 우중: 로켓 -->
      <g transform="translate(1785 720) rotate(38) scale(1.5)">
        <path d="M-13,50 Q0,112 13,50Z" fill="#ffd27a"/>
        <path d="M-7,50 Q0,86 7,50Z" fill="#fff0b3"/>
        <path d="M-18,18 L-46,54 L-18,46Z" fill="#ffb3c1"/>
        <path d="M18,18 L46,54 L18,46Z" fill="#ffb3c1"/>
        <path d="M0,-72 C30,-42 30,20 19,52 L-19,52 C-30,20 -30,-42 0,-72Z" fill="#fff" stroke="#c9cff2" stroke-width="3"/>
        <path d="M0,-72 C14,-58 22,-44 25,-30 L-25,-30 C-22,-44 -14,-58 0,-72Z" fill="#ffb3c1"/>
        <circle cx="0" cy="-8" r="12" fill="#bfe3ff" stroke="#c9cff2" stroke-width="3"/>
      </g>
      <!-- 우하: 노란 행성 -->
      <g transform="translate(1700 985)">
        <circle r="38" fill="url(#gPC)"/>
        <path d="M-36,-8 Q0,6 36,-8" stroke="#fff" stroke-opacity=".5" stroke-width="7" fill="none"/>
      </g>
    </svg>
    <div class="card">
      <h1><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="32" cy="32" rx="29" ry="11" transform="rotate(-25 32 32)" fill="none" stroke="#b9b0f2" stroke-width="3.5"/><circle cx="32" cy="32" r="13" fill="#ffd36e"/><circle cx="28" cy="28" r="5" fill="#fff0b3"/><circle cx="58" cy="20" r="5.5" fill="#ff9ec4"/></svg><span class="gt">회전하는 물체 그리고 공전</span></h1>
      <h2>점수판 설정</h2>

      <div class="sec-title">① 팀 이름 입력 <small>(한글·영문, 최소 2팀 / 빈칸은 제외됩니다)</small></div>
      <div class="team-grid" id="teamGrid"></div>

      <div class="sec-title">② 진행방법 선택</div>
      <div class="modes">
        <label class="mode"><input type="radio" name="mode" value="best" checked>
          <div class="box"><b>최고점 선택방식</b><span>시도할 때마다 기록을 비교해<br>가장 좋은 기록만 남깁니다.</span></div></label>
        <label class="mode"><input type="radio" name="mode" value="all">
          <div class="box"><b>전체기록 표시 방식</b><span>참가자별 이름과 기록을 모두<br>표에 표시합니다. (점수 계산 없음)</span></div></label>
      </div>
      <div id="msg"></div>
      <button id="goBtn">기록하기</button>
    </div>
  </div>

  <!-- ===== 참가자 이름 입력 화면 (전체기록 방식) ===== -->
  <div id="namesScreen" class="screen">
    <div id="ntop">
      <div id="ntitle">
        <h1><span class="gt">참가자 이름 입력</span></h1>
        <p>종목별로 팀마다 최대 5명까지 입력합니다. 입력한 순서대로 기록판에 표시되며 빈칸은 제외됩니다. (Enter = 다음 칸)</p>
        <p id="nmsg"></p>
      </div>
      <div id="nbtns">
        <button class="btn" id="nBack">뒤로</button>
        <button class="btn" id="nGo">기록하기</button>
      </div>
    </div>
    <div id="nameGrid"></div>
  </div>

  <!-- ===== 점수판 화면 ===== -->
  <div id="boardScreen" class="screen">
    <div id="topbar">
      <div id="ttl">
        <h1><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="32" cy="32" rx="29" ry="11" transform="rotate(-25 32 32)" fill="none" stroke="#b9b0f2" stroke-width="3.5"/><circle cx="32" cy="32" r="13" fill="#ffd36e"/><circle cx="28" cy="28" r="5" fill="#fff0b3"/><circle cx="58" cy="20" r="5.5" fill="#ff9ec4"/></svg><span class="gt">회전하는 물체 그리고 공전</span></h1>
        <div class="meta"><span class="chip" id="modeTxt">최고점 방식</span><span class="chip2">선택된 칸 <span id="sel">없음</span></span></div>
        <p id="swHint"></p>
      </div>
      <div id="sw">
        <div id="swTime">0:00.00</div>
        <div id="bigBtns">
          <button class="btn big" id="bToggle">시작</button>
          <button class="btn big" id="bFail">실패</button>
        </div>
        <div id="smallBtns">
          <button class="btn sm" id="bReset">리셋</button>
          <button class="btn sm" id="bClear">칸 초기화</button>
          <button class="btn sm" id="bHome">처음으로</button>
        </div>
        <div id="rightBtns">
          <button class="btn" id="bUndo" disabled>되돌리기</button>
          <button class="btn" id="bManual">수기입력</button>
        </div>
      </div>
    </div>
    <div id="board"></div>
  </div>
</div>

<script>
/* ---------- 화면 맞춤 (1920x1080 고정 스테이지를 창 크기에 맞춰 축소/확대) ---------- */
const stage=document.getElementById('stage');
function fit(){
  const s=Math.min(innerWidth/1920,innerHeight/1080);
  stage.style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`;
}
addEventListener('resize',fit);fit();

/* ---------- 상수 ---------- */
const COLORS=[
  {bg:'#fff08a',fg:'#2b3553'},{bg:'#b8e994',fg:'#2b3553'},{bg:'#8fd6f7',fg:'#2b3553'},
  {bg:'#ff9e9e',fg:'#2b3553'},{bg:'#ffc78a',fg:'#2b3553'},{bg:'#cdb3f7',fg:'#2b3553'}
];
const EVENTS=[
  {name:['쥐볼','놀이','짧게'],sub:'',type:'time'},
  {name:['쥐볼','놀이','길게'],sub:'',type:'time'},
  {name:['카우','보이','오래'],sub:'',type:'time'},
  {name:['카우','보이','많이'],sub:'',type:'count'}
];

/* ---------- 설정 화면 ---------- */
const teamGrid=document.getElementById('teamGrid');
for(let i=0;i<6;i++){
  const d=document.createElement('div');d.className='team-in';
  d.innerHTML=`<div class="dot" style="background:${COLORS[i].bg};color:${COLORS[i].fg}">${i+1}</div>
    <input type="text" maxlength="12" placeholder="팀 ${i+1}" autocomplete="off">`;
  teamGrid.appendChild(d);
}
const inputs=[...teamGrid.querySelectorAll('input')];
const NAME_RE=/[^a-zA-Z0-9ㄱ-ㅎㅏ-ㅣ가-힣 ]/g;
inputs.forEach(inp=>inp.addEventListener('input',()=>{
  const v=inp.value.replace(NAME_RE,'');
  if(v!==inp.value)inp.value=v;
}));
const msg=document.getElementById('msg');

const MAXP=5;                       // 종목별·팀별 최대 참가자 수
const newEntry=()=>({rec:null,fail:false});
let mode='best',teams=[],players=[],data=[],sel=null;
// data[e][t][k] = 종목 e, 팀 t, k번째 기록 (최고점 방식은 k=0 하나, 전체기록 방식은 참가자 수만큼)

document.getElementById('goBtn').onclick=()=>{
  const names=inputs.map(i=>i.value.trim()).filter(v=>v);
  if(names.length<2){msg.textContent='팀 이름을 2개 이상 입력해 주세요.';return}
  msg.textContent='';
  teams=names.map((n,i)=>({name:n,c:COLORS[i]}));
  mode=document.querySelector('input[name=mode]:checked').value;
  if(mode==='all'){buildNames();show('namesScreen');return}
  startBoard();
};
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}

function startBoard(){
  data=EVENTS.map((_,e)=>teams.map((_,t)=>mode==='all'?players[e][t].map(newEntry):[newEntry()]));
  sel=null;undoStack=[];lastMeasure=null;runCell=null;bUndo.disabled=true;
  resetSW();setManual(false);
  document.getElementById('modeTxt').textContent=mode==='all'?'전체기록 방식':'최고점 방식';
  buildBoard();
  show('boardScreen');
  fitAll();
}

/* ---------- 참가자 이름 입력 (전체기록 방식) ---------- */
const nameGrid=document.getElementById('nameGrid');
const nmsg=document.getElementById('nmsg');
let nameDraft={};
function buildNames(){
  nmsg.textContent='';
  nameGrid.style.gridTemplateColumns=`170px repeat(${teams.length},minmax(0,1fr))`;
  let h=`<div class="c corner"><span class="t">팀</span><span class="j">종목</span></div>`;
  teams.forEach(t=>h+=`<div class="c th" style="background:${t.c.bg};color:${t.c.fg}">${esc(t.name)}</div>`);
  EVENTS.forEach((ev,e)=>{
    const rc='r'+(e%2);
    h+=`<div class="c ev ${rc}">${ev.name.map(x=>`<div>${x}</div>`).join('')}</div>`;
    teams.forEach((t,ti)=>{
      h+=`<div class="ncell ${rc}">`;
      for(let k=0;k<MAXP;k++){
        const key=`${e}|${ti}|${k}`;
        h+=`<input type="text" maxlength="8" placeholder="참가자 ${k+1}" autocomplete="off" data-key="${key}" value="${esc(nameDraft[key]||'')}">`;
      }
      h+='</div>';
    });
  });
  nameGrid.innerHTML=h;
  const ins=[...nameGrid.querySelectorAll('input')];
  ins.forEach((inp,i)=>{
    inp.oninput=()=>{
      const v=inp.value.replace(NAME_RE,'');
      if(v!==inp.value)inp.value=v;
      nameDraft[inp.dataset.key]=inp.value;
    };
    inp.onkeydown=ev=>{
      if(ev.key==='Enter'){ev.preventDefault();(ins[i+1]||inp).focus()}
    };
  });
}
document.getElementById('nBack').onclick=()=>show('setup');
document.getElementById('nGo').onclick=()=>{
  const ins=[...nameGrid.querySelectorAll('input')];
  ins.forEach(i=>nameDraft[i.dataset.key]=i.value);
  players=EVENTS.map((_,e)=>teams.map((_,t)=>{
    const a=[];
    for(let k=0;k<MAXP;k++){const v=(nameDraft[`${e}|${t}|${k}`]||'').trim();if(v)a.push(v)}
    return a;
  }));
  if(!players.some(r=>r.some(a=>a.length))){nmsg.textContent='참가자를 한 명 이상 입력해 주세요.';return}
  startBoard();
};

/* ---------- 순위/점수 (최고점 방식 전용) ---------- */
function calc(){
  const N=teams.length;
  const pts=EVENTS.map((_,e)=>{
    const arr=data[e].map((d,t)=>({t,v:d[0].rec})).filter(x=>x.v!==null).sort((a,b)=>b.v-a.v);
    const p=teams.map(()=>0);
    const distinct=[...new Set(arr.map(x=>x.v))];   // 큰 값부터 중복 제거
    arr.forEach(x=>{
      p[x.t]=N-distinct.indexOf(x.v);            // 동점은 같은 점수, 다음 순위는 이어서 (4,3,3,2)
    });
    return p;
  });
  const tot=teams.map((_,t)=>pts.reduce((s,r)=>s+r[t],0));
  return {pts,tot};
}
function fmt(ms){
  const cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000)%60,m=Math.floor(ms/60000);
  return String(m)+':'+String(s).padStart(2,'0')+'.'+String(cs).padStart(2,'0');
}
const recText=(ev,d)=>d.rec!==null?(ev.type==='count'?d.rec:fmt(d.rec)):(d.fail?'-':'');

/* ---------- 점수판 그리기 ---------- */
const board=document.getElementById('board');
function buildBoard(){
  const n=teams.length;
  board.style.gridTemplateColumns=`170px repeat(${n},minmax(0,1fr))`;
  board.style.gridTemplateRows=mode==='all'?`120px repeat(4,minmax(0,1fr))`:`120px repeat(4,minmax(0,1fr)) 105px`;
  board.style.setProperty('--ptw',n>=5?'80px':'92px');
  render();
}
function headHtml(){
  let h=`<div class="c corner"><span class="t">팀</span><span class="j">종목</span></div>`;
  teams.forEach(t=>h+=`<div class="c th" style="background:${t.c.bg};color:${t.c.fg}">${esc(t.name)}</div>`);
  return h;
}
const evHtml=(ev,rc)=>`<div class="c ev ${rc}">${ev.name.map(x=>`<div>${x}</div>`).join('')}${ev.sub?`<small>${ev.sub}</small>`:''}</div>`;
function recHtmlOf(ev,d,e,t,k){
  const val=recText(ev,d);
  return ev.type==='count'
    ?`<div class="rec"><input inputmode="numeric" value="${val}" data-e="${e}" data-t="${t}" data-k="${k}"></div>`
    :`<div class="rec">${val}</div>`;
}
function render(){
  if(mode==='all'){renderAll();return}
  const {pts,tot}=calc();
  let h=headHtml();
  EVENTS.forEach((ev,e)=>{
    const rc='r'+(e%2);
    h+=evHtml(ev,rc);
    teams.forEach((t,ti)=>{
      const d=data[e][ti][0];
      const isSel=sel&&sel.e===e&&sel.t===ti;
      const pv=(d.rec!==null||d.fail)?pts[e][ti]:'';
      h+=`<div class="c ${rc} pair cell unit ${isSel?'sel':''}" data-e="${e}" data-t="${ti}" data-k="0">${recHtmlOf(ev,d,e,ti,0)}<div class="pt">${pv}</div></div>`;
    });
  });
  h+=`<div class="c tot r0">합계</div>`;
  teams.forEach((t,ti)=>h+=`<div class="c pair r0"><div class="rec"></div><div class="pt totv">${tot[ti]}</div></div>`);
  board.innerHTML=h;
  bindInputs();
  updateSelLabel();
}
function renderAll(){
  let h=headHtml();
  EVENTS.forEach((ev,e)=>{
    const rc='r'+(e%2);
    h+=evHtml(ev,rc);
    // 이 종목의 모든 칸에 기록(또는 실패 '-')이 입력되면 가장 큰 기록을 찾는다 (동점이면 모두)
    const all=data[e].flat();
    let top=null;
    if(all.length&&all.every(d=>d.rec!==null||d.fail)){
      const recs=all.filter(d=>d.rec!==null).map(d=>d.rec);
      if(recs.length)top=Math.max(...recs);
    }
    teams.forEach((t,ti)=>{
      const list=players[e][ti];
      if(!list.length){h+=`<div class="c pcell empty ${rc}">참가자 없음</div>`;return}
      h+=`<div class="c pcell ${rc}" style="grid-template-rows:repeat(${list.length},minmax(0,1fr))">`;
      list.forEach((nm,k)=>{
        const d=data[e][ti][k];
        const isSel=sel&&sel.e===e&&sel.t===ti&&sel.k===k;
        const isTop=top!==null&&d.rec===top;
        h+=`<div class="prow unit ${isSel?'sel':''} ${isTop?'top':''}" data-e="${e}" data-t="${ti}" data-k="${k}"><div class="pname" title="${esc(nm)}">${esc(nm)}</div>${recHtmlOf(ev,d,e,ti,k)}</div>`;
      });
      h+='</div>';
    });
  });
  board.innerHTML=h;
  bindInputs();
  updateSelLabel();
  fitCells();
}
function bindInputs(){
  board.querySelectorAll('input').forEach(inp=>{
    // 칸을 누르면 기존 숫자를 모두 선택해서 바로 새 숫자로 덮어쓸 수 있게 함 (선택 칸도 함께 표시)
    inp.onfocus=()=>{const e=+inp.dataset.e,t=+inp.dataset.t,k=+inp.dataset.k;if(!same(sel,e,t,k))selectCell(e,t,k);inp.select()};
    inp.onmouseup=ev=>ev.preventDefault();
    inp.onkeydown=ev=>{if(ev.key==='Enter')inp.blur()};
    inp.oninput=()=>{inp.value=inp.value.replace(/[^0-9-]/g,'')};
    inp.onchange=()=>commitCount(+inp.dataset.e,+inp.dataset.t,+inp.dataset.k,inp.value.trim());
  });
}
function updateSelLabel(){
  let t='없음';
  if(sel){
    t=`${EVENTS[sel.e].name.join('')}·${teams[sel.t].name}`;
    if(mode==='all')t+=`·${players[sel.e][sel.t][sel.k]}`;
  }
  document.getElementById('sel').textContent=t;
}
board.addEventListener('click',ev=>{
  if(ev.target.tagName==='INPUT')return;
  const u=ev.target.closest('.unit');
  if(!u)return;
  const e=+u.dataset.e,t=+u.dataset.t,k=+u.dataset.k;
  selectCell(e,t,k);
  if(manualMode&&EVENTS[e].type==='time')openManual(u,e,t,k);
});

/* '0:00.00' 글자 폭 측정 (100px 기준) */
function timeW100(){
  const m=document.createElement('span');
  m.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;font-weight:800;font-size:100px;font-variant-numeric:tabular-nums;font-family:inherit';
  m.textContent='0:00.00';
  stage.appendChild(m);
  const w=m.getBoundingClientRect().width/(stage.getBoundingClientRect().width/1920);
  stage.removeChild(m);
  return w;
}
/* 최고점 방식: 팀 수에 맞춰 정해진 기록칸 폭에 '0:00.00'이 들어가도록 글자 크기를 한 번 계산 */
function fitFont(){
  const rec=board.querySelector('.cell .rec');
  if(!rec)return;
  const recW=rec.clientWidth;
  const fs=Math.max(14,Math.min(70,Math.floor((recW-24)/timeW100()*100)));
  board.style.setProperty('--recfs',fs+'px');
}
/* 전체기록 방식: 칸(팀×종목)의 크기와 참가자 수에 맞춰 이름·기록 글자 크기를 계산 */
function fitCells(){
  const w100=timeW100();
  board.querySelectorAll('.pcell:not(.empty)').forEach(c=>{
    const n=c.children.length,H=c.clientHeight,W=c.clientWidth;
    if(!H||!W)return;
    const gap=3,subH=(H-(n-1)*gap)/n;
    const recW=W*0.58-gap,nameW=W*0.42-gap;
    const rfs=Math.floor(Math.min(subH*0.64,60,(recW-10)/w100*100));
    let L=2;c.querySelectorAll('.pname').forEach(x=>{L=Math.max(L,x.textContent.length)});
    const nfs=Math.floor(Math.min(subH*0.6,34,(nameW-12)/L));
    c.style.setProperty('--rfs',Math.max(10,rfs)+'px');
    c.style.setProperty('--nfs',Math.max(10,nfs)+'px');
  });
}
function fitAll(){ if(mode==='all')fitCells(); else fitFont(); }
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ---------- 선택 / 입력 ---------- */
function hint(t){const h=document.getElementById('swHint');h.textContent=t;clearTimeout(hint.t);if(t)hint.t=setTimeout(()=>h.textContent='',2500)}
const same=(a,e,t,k)=>a&&a.e===e&&a.t===t&&a.k===k;
function selectCell(e,t,k){
  if(running&&!manualMode){hint('측정 중에는 칸을 바꿀 수 없습니다.');return}
  if(!same(sel,e,t,k))lastMeasure=null;
  sel={e,t,k};
  board.querySelectorAll('.unit').forEach(c=>c.classList.toggle('sel',+c.dataset.e===e&&+c.dataset.t===t&&+c.dataset.k===k));
  updateSelLabel();
  if(EVENTS[e].type==='count'){
    const inp=board.querySelector(`input[data-e="${e}"][data-t="${t}"][data-k="${k}"]`);
    if(inp){inp.focus();inp.select()}
  }
}
/* 되돌리기: 최근 변경을 최대 30단계까지 저장 */
const UNDO_MAX=30;
let undoStack=[],lastMeasure=null,manualMode=false,runCell=null;
const bUndo=document.getElementById('bUndo');
function mutate(fn){
  const before=JSON.stringify(data);
  fn();
  if(JSON.stringify(data)!==before){undoStack.push(before);if(undoStack.length>UNDO_MAX)undoStack.shift();bUndo.disabled=false}
}
/* 기록 갱신 규칙: 최고점 방식은 더 큰 값만 반영, 전체기록 방식은 칸당 1회 측정이므로 항상 새 기록으로 덮어씀 */
const accepts=(d,v)=>mode==='all'||d.rec===null||v>d.rec;
function commitCount(e,t,k,v){
  const d=data[e][t][k];
  mutate(()=>{
    if(v===''||v==='-'){ if(v==='-'&&d.rec===null)d.fail=true; }
    else{
      const n=parseInt(v,10);
      if(!isNaN(n)&&accepts(d,n)){d.rec=n;d.fail=false}
    }
  });
  render();
}

/* ---------- 스톱워치 ---------- */
let running=false,t0=0,elapsed=0,raf=0;
const swTime=document.getElementById('swTime');
const MAX_MS=10*60*1000;
function tick(){
  elapsed=performance.now()-t0;
  if(elapsed>=MAX_MS){            // 10분 초과: 0:00.00으로 돌아가며 정지 (기록하지 않음)
    resetSW();hint('10분을 넘어 스톱워치가 멈췄습니다. 기록되지 않았습니다.');return;
  }
  swTime.textContent=fmt(elapsed);raf=requestAnimationFrame(tick);
}
function resetSW(){cancelAnimationFrame(raf);running=false;elapsed=0;swTime.textContent='0:00.00';swTime.classList.remove('run');if(typeof setToggle==='function')setToggle()}

const bToggle=document.getElementById('bToggle');
function setToggle(){bToggle.textContent=running?'정지':'시작';bToggle.classList.toggle('run',running)}
bToggle.onclick=()=>{
  if(!running){
    if(!sel){hint('먼저 기록칸을 선택하세요.');return}
    if(EVENTS[sel.e].type==='count'){hint('카우보이많이는 숫자를 직접 입력하세요.');return}
    lastMeasure=null;runCell={e:sel.e,t:sel.t,k:sel.k};
    elapsed=0;t0=performance.now();running=true;swTime.classList.add('run');setToggle();tick();
  }else{
    cancelAnimationFrame(raf);elapsed=performance.now()-t0;running=false;
    swTime.textContent=fmt(elapsed);swTime.classList.remove('run');setToggle();
    const rc=runCell||sel;
    const d=data[rc.e][rc.t][rc.k];
    lastMeasure={e:rc.e,t:rc.t,k:rc.k,rec:d.rec,fail:d.fail};   // 이 측정 직전의 기록 보관
    mutate(()=>{ if(accepts(d,elapsed)){d.rec=Math.round(elapsed);d.fail=false} });
    sel={e:rc.e,t:rc.t,k:rc.k};
    render();
  }
};
/* ---------- 수기입력 ---------- */
const bManual=document.getElementById('bManual');
function setManual(on){
  manualMode=on;
  bManual.classList.toggle('on',on);
  bManual.textContent=on?'수기입력 ON':'수기입력';
  board.classList.toggle('manual',on);
}
bManual.onclick=()=>{
  setManual(!manualMode);
  hint(manualMode?'수기입력 ON: 시간 칸을 클릭해 숫자를 입력하고 Enter':'수기입력을 껐습니다.');
};
function fmtDigits(d){const p=d.padStart(5,'0');return (+p[0])+':'+p.slice(1,3)+'.'+p.slice(3)}
function openManual(unit,e,t,k){
  const rec=unit.querySelector('.rec');
  if(!rec||rec.querySelector('input'))return;
  const orig=rec.innerHTML;
  rec.innerHTML='<input class="mi" inputmode="numeric" autocomplete="off">';
  const inp=rec.firstChild;
  let digits='';
  const show=()=>{inp.value=fmtDigits(digits);inp.setSelectionRange(inp.value.length,inp.value.length)};
  show();inp.focus();
  hint('숫자만 입력하면 분:초.센티초로 채워집니다. Enter=기록, Esc=취소');
  let done=false;
  const close=()=>{if(done)return;done=true;rec.innerHTML=orig};
  inp.oninput=()=>{digits=inp.value.replace(/\D/g,'').replace(/^0+/,'').slice(-5);show()};
  inp.onkeydown=ev=>{
    if(ev.key==='Escape'){close();return}
    if(ev.key!=='Enter')return;
    const p=digits.padStart(5,'0');
    const m=+p[0],sec=+p.slice(1,3),cs=+p.slice(3);
    if(sec>=60){hint('초는 59 이하로 입력하세요.');return}
    const ms=(m*60+sec)*1000+cs*10;
    if(ms<=0){hint('0보다 큰 시간을 입력하세요.');return}
    done=true;
    const d=data[e][t][k];
    lastMeasure={e,t,k,rec:d.rec,fail:d.fail};
    mutate(()=>{ if(accepts(d,ms)){d.rec=ms;d.fail=false} });
    render();
  };
  inp.onblur=close;
}
document.getElementById('bReset').onclick=()=>resetSW();
/* 실패: 측정 중이면 폐기 / 방금 정지로 기록된 값이 있으면 그 기록을 지우고 이전 기록으로 복원 */
document.getElementById('bFail').onclick=()=>{
  if(!sel){hint('먼저 기록칸을 선택하세요.');return}
  const wasRunning=running;
  resetSW();
  mutate(()=>{
    const d=data[sel.e][sel.t][sel.k];
    if(!wasRunning&&same(lastMeasure,sel.e,sel.t,sel.k)){
      d.rec=lastMeasure.rec;d.fail=lastMeasure.fail;     // 방금 측정값 삭제 → 이전 기록 복원
    }
    if(d.rec===null)d.fail=true;                          // 이전 기록이 없으면 '-'
  });
  lastMeasure=null;
  render();
};
document.getElementById('bClear').onclick=()=>{
  if(!sel){hint('초기화할 칸을 선택하세요.');return}
  if(running)resetSW();
  lastMeasure=null;
  mutate(()=>{data[sel.e][sel.t][sel.k]=newEntry()});
  render();
};
bUndo.onclick=()=>{
  if(!undoStack.length)return;
  if(running)resetSW();
  data=JSON.parse(undoStack.pop());lastMeasure=null;bUndo.disabled=!undoStack.length;
  render();hint('직전 변경을 되돌렸습니다.');
};
document.getElementById('bHome').onclick=()=>{
  resetSW();setManual(false);sel=null;teams=[];players=[];data=[];undoStack=[];lastMeasure=null;runCell=null;nameDraft={};bUndo.disabled=true;board.innerHTML='';
  inputs.forEach(i=>i.value='');msg.textContent='';
  show('setup');
};
</script>
